<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Image As</title>
  <style>
    :root {
      --bg: #f6f5ff;
      --surface: #ffffff;
      --ink: #1e1b4b;
      --muted: #5b5790;
      --line: #e2def8;
      --accent: #6366f1;
      --accent-strong: #4f46e5;
      --accent-soft: #eeedfd;
    }

    * { box-sizing: border-box; }

    body {
      width: 320px;
      margin: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--bg);
    }

    button { font: inherit; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .top img { width: 24px; height: 24px; }

    .top h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }

    main { padding: 16px; }

    /* Richiesta di recensione */
    /* Raggi concentrici: esterno 16 = pulsanti 6 + padding 10 */
    .review {
      margin-bottom: 16px;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .review p { padding: 2px 4px 0; }
    .review[hidden] { display: none; }
    .review p { margin: 0 0 10px; }
    .review-actions { display: flex; gap: 6px; }
    .review-actions button {
      flex: 1;
      padding: 6px 4px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    .review-actions button:hover { border-color: var(--accent); }
    .review-actions .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .review-actions .primary:hover { background: var(--accent-strong); }

    /* Download in blocco: l'azione principale del popup */
    .bulk h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 2px;
      font-size: 14px;
      font-weight: 600;
    }
    .bulk p { margin: 0 0 10px; color: var(--muted); }

    .new-pill {
      padding: 0 7px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 11px;
      font-weight: 600;
    }
    .new-pill[hidden] { display: none; }

    .bulk-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 12px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .bulk-btn:hover { background: var(--accent-strong); }

    /* Come si usa il menu del clic destro */
    .howto {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .howto h2 {
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: 600;
    }
    .howto ol {
      margin: 0;
      padding-left: 18px;
    }
    .howto li { padding-left: 2px; }
    .howto li + li { margin-top: 2px; }
    .howto li::marker { color: var(--muted); }

    .bottom {
      padding: 10px 16px 14px;
      color: var(--muted);
      font-size: 12px;
    }
    .bottom p { margin: 0 0 6px; }
    .bottom nav { display: flex; justify-content: space-around; }
    .bottom a { color: var(--accent-strong); text-decoration: none; }
    .bottom a:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <header class="top">
    <img src="icons/icon48.png" alt="">
    <h1 data-i18n="popupHeading">Save Image As</h1>
  </header>

  <main>
    <section class="review" id="reviewBanner" hidden>
      <p id="reviewText"></p>
      <div class="review-actions">
        <button class="primary" id="reviewRate"></button>
        <button id="reviewLater"></button>
        <button id="reviewNever"></button>
      </div>
    </section>

    <section class="bulk">
      <h2><span data-i18n="popupBulkHeading">Bulk download</span><span class="new-pill" id="bulkNewPill" hidden></span></h2>
      <p data-i18n="popupBulkDesc">Find &amp; download all images on this page</p>
      <button class="bulk-btn" id="bulkBtn">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span data-i18n="popupBulkButton">Open Bulk Download</span>
      </button>
    </section>

    <section class="howto">
      <h2 data-i18n="popupHowToHeading">Save a single image</h2>
      <ol>
        <li data-i18n="popupStep1">Right-click on any image</li>
        <li data-i18n="popupStep2">Select "Save image as..."</li>
        <li data-i18n="popupStep3">Choose PNG, JPG, WEBP or PDF</li>
      </ol>
    </section>
  </main>

  <footer class="bottom">
    <p data-i18n="popupPrivacy">100% privacy-friendly, all processing happens locally</p>
    <nav>
      <a href="https://save-image-as.vercel.app/" data-site-path="/" target="_blank" data-i18n="popupWebsite">Website</a>
      <a href="https://save-image-as.vercel.app/#support" data-site-path="/#support" target="_blank" data-i18n="popupSupport">Support</a>
      <a href="https://save-image-as.vercel.app/privacy" data-site-path="/privacy" target="_blank" data-i18n="popupPrivacyLink">Privacy</a>
    </nav>
  </footer>
  <script src="popup.js"></script>
</body>

</html>
